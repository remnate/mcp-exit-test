[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-exit-test"
version = "0.1.0"
description = "Witness registered MCP stdio fixture lifetimes across Linux host transitions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE-MCP", "NOTICE.md"]
dependencies = ["jsonschema==4.26.0", "rfc3986-validator==0.1.1"]
classifiers = ["Operating System :: POSIX :: Linux"]

[project.scripts]
mcp-exit-test = "mcp_exit_test.cli:main"

[tool.setuptools]
packages = ["mcp_exit_test"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
mcp_exit_test = ["schemas/*.json", "sdk/*.mjs", "sdk/*.json", "wrapper/*.json", "wrapper/probe"]
